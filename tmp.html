<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>太阳能电池轨道温度模拟</title>
  <link rel="stylesheet" href="workbench.css">
  <script src="chart.js" defer></script>
  <script src="orbit-temperature.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="shell header-inner">
      <a class="brand" href="index.html">Space Energy Tools</a>
      <nav aria-label="站点导航">
        <a href="index.html">返回首页</a>
        <a href="docs/tmp.html">算法说明</a>
      </nav>
    </div>
  </header>
  <main class="shell">
    <div class="page-title">
      <h1>太阳能电池轨道温度模拟</h1>
      <span class="tag">预设轨道 · 集总热平衡</span>
    </div>
    <dl class="metrics" aria-label="轨道温度摘要">
      <div><dt>单圈周期</dt><dd><output id="periodMetric">--</output><small>min</small></dd></div>
      <div><dt>单圈地影</dt><dd><output id="eclipseMetric">--</output><small>min</small></dd></div>
      <div><dt>晶硅温度范围</dt><dd class="blue"><output id="siRange">--</output><small>°C</small></dd></div>
      <div><dt>钙钛矿温度范围</dt><dd class="amber"><output id="pvRange">--</output><small>°C</small></dd></div>
    </dl>
    <div class="work-grid thermal-grid">
      <form id="thermalForm" class="work-surface" novalidate>
        <h2>模拟参数</h2>
        <fieldset class="field-section">
          <legend>轨道工况</legend>
          <div class="fields">
            <label class="full-field">轨道预设
              <select id="orbit-type">
                <option value="leo400">400 km 低地轨道</option>
                <option value="leo2000">2000 km 低地轨道</option>
                <option value="dawn-dusk">晨昏轨道</option>
                <option value="geo">地球同步轨道</option>
                <option value="sso">太阳同步轨道</option>
              </select>
            </label>
            <label>模拟圈数<input id="orbits" type="number" min="1" max="10" step="1" value="3" required></label>
            <label>初始温度 <span>°C</span><input id="initialTemp" type="number" min="-270.45" max="200" step="any" value="20" required></label>
          </div>
        </fieldset>
        <fieldset class="field-section">
          <legend>晶硅太阳能电池</legend>
          <div class="fields">
            <label>发射率<input id="si-emissivity" type="number" min="0.1" max="1" step="any" value="0.85" required></label>
            <label>吸收率<input id="si-absorptivity" type="number" min="0.1" max="1" step="any" value="0.92" required></label>
            <label>转换效率<input id="si-efficiency" type="number" min="0" max="0.5" step="any" value="0.22" required></label>
            <label>面热容 <span>J/(m²·K)</span><input id="si-heat-capacity" type="number" min="100" max="100000" step="any" value="1000" required></label>
          </div>
        </fieldset>
        <fieldset class="field-section">
          <legend>钙钛矿太阳能电池</legend>
          <div class="fields">
            <label>发射率<input id="perovskite-emissivity" type="number" min="0.1" max="1" step="any" value="0.78" required></label>
            <label>吸收率<input id="perovskite-absorptivity" type="number" min="0.1" max="1" step="any" value="0.95" required></label>
            <label>转换效率<input id="perovskite-efficiency" type="number" min="0" max="0.5" step="any" value="0.26" required></label>
            <label>面热容 <span>J/(m²·K)</span><input id="perovskite-heat-capacity" type="number" min="100" max="100000" step="any" value="800" required></label>
          </div>
        </fieldset>
        <div class="actions">
          <button id="simulate-btn" type="submit">开始模拟</button>
          <button id="export-btn" type="button" class="secondary" disabled>导出 CSV</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </form>
      <div class="thermal-charts">
        <section class="work-surface" aria-labelledby="temperatureHeading">
          <div class="section-title">
            <h2 id="temperatureHeading">轨道温度时序</h2>
            <span class="chart-key"><i class="swatch shadow"></i>地影区间</span>
          </div>
          <div class="chart-area chart-main">
            <canvas id="temperature-chart" aria-label="晶硅与钙钛矿电池的温度变化"></canvas>
          </div>
        </section>
        <div class="chart-pair">
          <section class="work-surface" aria-labelledby="irradianceHeading">
            <h2 id="irradianceHeading">太阳辐照时序</h2>
            <div class="chart-area"><canvas id="irradiance-chart" aria-label="日照与地影辐照变化"></canvas></div>
          </section>
          <section class="work-surface" aria-labelledby="spectrumHeading">
            <h2 id="spectrumHeading">AM0 光谱形状示意</h2>
            <div class="chart-area"><canvas id="spectrum-chart" aria-label="归一化光谱形状示意"></canvas></div>
          </section>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
